[general]
run_name = B200_Custom_Stacked_DRAM

[architecture_presets]
# Distributed Tiled Arrays (10x10 tiles = 100 independent arrays)
# Simulating a SINGLE TILE here, scaled up later in the harness
ArrayHeight:    32
ArrayWidth:     32
# Negligible SRAM per tile since TSVs provide direct, massive bandwidth
IfmapSramSzkB:  128
FilterSramSzkB: 128
OfmapSramSzkB:  128
IfmapOffset:    0
FilterOffset:   10000000
OfmapOffset:    20000000
# 1000x total bandwidth = 8,000,000 GB/s. Per tile (1/100) = 80,000 GB/s
Bandwidth :     80000
# Weights come directly from TSVs above, Output Stationary minimizes partial sum movement
Dataflow :      os
