[general]
run_name = B200_Baseline

[architecture_presets]
# Monolithic large systolic array (representing a massive Tensor Core block)
ArrayHeight:    256
ArrayWidth:     256
# Massive SRAMs (total ~192MB) to hide HBM latency
IfmapSramSzkB:  65536
FilterSramSzkB: 65536
OfmapSramSzkB:  65536
IfmapOffset:    0
FilterOffset:   10000000
OfmapOffset:    20000000
# Shoreline HBM Bandwidth (8 TB/s -> approx 8000 GB/s)
Bandwidth :     8000
Dataflow :      ws
